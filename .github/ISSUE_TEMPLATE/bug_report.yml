name: Bug report
description: Report a problem without including personal or sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real requests, contact details, account information, or sensitive data."
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
    validations:
      required: false
