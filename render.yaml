services:
  - type: web
    name: aidweave
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 60 --access-logfile - --error-logfile - server:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aidweave-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_TOKEN
        generateValue: true
      - key: SEED_DEMO
        value: "0"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: aidweave-db
    databaseName: aidweave
    user: aidweave
    plan: free
    region: singapore
